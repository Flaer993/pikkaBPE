[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pikkabpe"
version = "0.3.0"
description = "Operator supervised warehouse camera workstation"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.8.3", "opencv-python==4.11.0.86", "numpy==2.1.3", "pyserial==3.5", "Pillow==11.3.0", "python-barcode==0.16.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0", "zxing-cpp==2.3.0"]

[project.scripts]
pikkabpe = "pikkabpe.app:main"

[tool.setuptools.packages.find]
include = ["pikkabpe*"]

[tool.setuptools.package-data]
pikkabpe = ["assets/*.svg", "assets/*.ico", "assets/*.png", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
