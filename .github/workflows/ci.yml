name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware -B build/firmware && cmake --build build/firmware && ctest --test-dir build/firmware --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: UI smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PIKKABPE_DATA = "$env:RUNNER_TEMP/pikkabpe-smoke"
          python -m pikkabpe.app --smoke-test
      - name: Build Windows client
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            dist/pikkaBPE-windows-x64.zip
            dist/SHA256SUMS.txt
  firmware-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: python3 scripts/fetch_firmware_deps.py
      - run: python3 scripts/build_firmware.py
      - name: Package board firmware
        run: tar -czf pikkaBPE-PB-H503-USB.tar.gz -C build/pb_h503 pikkaBPE-PB-H503-USB.bin pikkaBPE-PB-H503-USB.hex pikkaBPE-PB-H503-USB.elf build-report.json SHA256SUMS.txt licenses
      - uses: actions/upload-artifact@v4
        with:
          name: pb-h503-firmware
          path: pikkaBPE-PB-H503-USB.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, firmware-core, firmware-board]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: pb-h503-firmware
          path: release
      - name: Release validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import pathlib,re,os; v=re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('pikkabpe/__init__.py').read_text()).group(1); assert os.environ['GITHUB_REF_NAME']=='v'+v, 'Tag/version mismatch'"
          tar -czf release/pikkaBPE-firmware-source.tar.gz firmware
          tar -czf release/pikkaBPE-CAD-P0.tar.gz cad
          cp output/pdf/pikkaBPE-manual.pdf release/
          gh release create "$GITHUB_REF_NAME" release/* --title "pikkāBPE $GITHUB_REF_NAME" --notes-file docs/release-notes.md
